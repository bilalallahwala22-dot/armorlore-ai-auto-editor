
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArmorLore AI Auto Editor</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 650px;
      padding: 28px;
      background: #1f2937;
      border: 1px solid #b58b45;
      border-radius: 14px;
      text-align: center;
    }

    h1 { color: #e4bd72; }

    p {
      line-height: 1.7;
      color: #d1d5db;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 22px;
      border-radius: 8px;
      background: #b58b45;
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover { background: #d6ad62; }
  </style>
</head>
<body>
  <main>
    <h1>ArmorLore AI Auto Editor</h1>
    <p>Your personal browser-based video editor.</p>
    <p>Open the editor to select your original voice-over files and images.</p>
    <a href="./app.html">Open Video Editor</a>
    <p>Note: Automatic narration synchronization and MP4 export are not yet implemented.</p>
  </main>
</body>
</html>
